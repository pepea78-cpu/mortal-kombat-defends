<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortal Kombat Defends (MK-D) - Toronyvédelem</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap');
        body { margin: 0; background-color: #080402; color: #fff; font-family: 'Cinzel', 'Georgia', serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        #game-container { position: relative; box-shadow: 0 0 40px rgba(255, 68, 0, 0.5); border: 4px solid #3d2215; border-radius: 8px; background: #110906; }
        canvas { display: block; cursor: default; }
        .ui-overlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 480px; background: rgba(12, 6, 4, 0.96); border: 3px solid #d4af37; border-image: linear-gradient(to right, #8a2010, #d4af37, #8a2010) 1; box-shadow: 0 0 50px rgba(255, 68, 0, 0.7), inset 0 0 25px rgba(0,0,0,0.95); padding: 25px; box-sizing: border-box; text-align: center; border-radius: 6px; z-index: 10; }
        .ui-header { font-size: 26px; font-weight: 900; color: #d4af37; text-transform: uppercase; text-shadow: 0 0 10px rgba(255, 68, 0, 0.9); margin-bottom: 20px; border-bottom: 2px solid #3d2215; padding-bottom: 12px; letter-spacing: 2px; }
        .ui-content { display: flex; justify-content: space-around; align-items: center; margin-bottom: 25px; }
        .ui-stat { text-align: left; font-size: 15px; line-height: 1.6; }
        .stat-highlight { color: #ffaa00; font-weight: bold; }
        .stat-up { color: #00ff66; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,102,0.3); }
        .ui-hero-img { width: 110px; height: 130px; border: 3px solid #ff4400; box-shadow: 0 0 20px rgba(255, 68, 0, 0.6); background: #1e0d05; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; border-radius: 4px; }
        .btn-group { display: flex; justify-content: space-around; gap: 15px; }
        .btn { background: linear-gradient(135deg, #8a1505 0%, #300300 100%); border: 2px solid #d4af37; color: #d4af37; padding: 12px 24px; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: all 0.2s; border-radius: 4px; flex: 1; }
        .btn:hover { transform: scale(1.03); box-shadow: 0 0 18px #ff4400; background: linear-gradient(135deg, #a8200b 0%, #4a0500 100%); }
        .btn:active { transform: scale(0.97); }
        .btn-cancel { background: #231b17; border: 2px solid #5a524e; color: #c0b6b2; }
        .btn-cancel:hover { background: #362c27; box-shadow: 0 0 12px rgba(255,255,255,0.15); }
    </style>
</head>
<body>

<div id="game-container">
    <div id="upgrade-modal" class="ui-overlay">
        <div class="ui-header">Hős fejlesztése</div>
        <div class="ui-content">
            <div id="modal-hero-pic" class="ui-hero-img">
                <span id="modal-hero-emoji" style="font-size:40px;">🔥</span>
                <span id="modal-hero-sub" style="font-size:11px; margin-top:10px;">HARCOS</span>
            </div>
            <div class="ui-stat">
                <h3 id="modal-hero-name" style="margin: 0 0 8px 0; color:#d4af37; font-size: 22px; text-shadow: 0 0 5px rgba(255,170,0,0.5);">SCORPION</h3>
                <div style="font-size: 17px; margin-bottom: 12px; font-weight: bold;" id="modal-hero-level">Szint: Lv.3 ➔ <span class="stat-up">Lv.4</span></div>
                <div>SEBZÉS: <span id="modal-stat-dmg">450</span> ➔ <span class="stat-up" id="modal-stat-dmg-next">620</span></div>
                <div>HATÓTÁV: <span id="modal-stat-rng">100</span> ➔ <span class="stat-up" id="modal-stat-rng-next">120</span></div>
                <div style="margin-top: 5px; font-size:12px; color:#aaa;" id="modal-hero-desc">Tüzes láncokkal ostorozza a gonoszt.</div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn" id="btn-confirm">Megerősít (1500 🪙)</button>
            <button class="btn btn-cancel" id="btn-cancel">Mégse</button>
        </div>
    </div>
    <canvas id="gameCanvas" width="960" height="540"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'hit-fire') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'hit-ice') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25); osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'hit-lightning') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(40, audioCtx.currentTime); osc.frequency.setValueAtTime(300, audioCtx.currentTime + 0.05); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'upgrade') {
        osc.type = 'square'; const now = audioCtx.currentTime; osc.frequency.setValueAtTime(261.63, now); osc.frequency.setValueAtTime(329.63, now + 0.1); osc.frequency.setValueAtTime(392.00, now + 0.2); osc.frequency.setValueAtTime(523.25, now + 0.3); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5); osc.start(); osc.stop(now + 0.5);
    } else if (type === 'buy') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'defeat') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.8); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8); osc.start(); osc.stop(audioCtx.currentTime + 0.8);
    } else if (type === 'victory') {
        osc.type = 'triangle'; const now = audioCtx.currentTime; osc.frequency.setValueAtTime(293.66, now); osc.frequency.setValueAtTime(349.23, now + 0.15); osc.frequency.setValueAtTime(440.00, now + 0.3); osc.frequency.setValueAtTime(587.33, now + 0.45); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.02, now + 0.8); osc.start(); osc.stop(now + 0.8);
    } else if (type === 'error') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(90, audioCtx.currentTime); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
}

let gold = 1500; let lives = 20; let score = 350; let wave = 1; let maxWaves = 10; let enemiesDefeated = 0; let gameOver = false; let gameWon = false;
const upgradeModal = document.getElementById('upgrade-modal');
const btnConfirm = document.getElementById('btn-confirm');
const btnCancel = document.getElementById('btn-cancel');
let selectedHeroIndex = null; let isPlacingTower = false; let hoverTile = { x: 0, y: 0 }; let towerToPlaceType = '';

const heroes = [
    { name: 'Scorpion', emoji: '🔥', x: 280, y: 190, level: 3, dmg: 450, dmgNext: 620, range: 100, rangeNext: 120, upgradeCost: 1500, color: '#ff5500', radius: 18, desc: 'Tüzes láncokkal ostorozza a gonoszt.' },
    { name: 'Sub-Zero', emoji: '❄️', x: 450, y: 260, level: 3, dmg: 300, dmgNext: 400, range: 120, rangeNext: 140, upgradeCost: 1500, color: '#00aeff', radius: 18, desc: 'Fagyasztó lövedékekkel lassítja az ellenséget.' },
    { name: 'Raiden', emoji: '⚡', x: 740, y: 320, level: 3, dmg: 500, dmgNext: 750, range: 130, rangeNext: 150, upgradeCost: 1500, color: '#ffffff', radius: 18, desc: 'Gyors villámcsapásokkal söpri el a seregeket.' }
];

let enemies = []; const spawnRate = 80; let spawnTimer = 0; let waveEnemiesCount = 10; let spawnedThisWave = 0;
const pathPoints = [ { x: 50, y: 400 }, { x: 180, y: 380 }, { x: 260, y: 450 }, { x: 400, y: 420 }, { x: 480, y: 320 }, { x: 620, y: 300 }, { x: 680, y: 190 }, { x: 760, y: 190 }, { x: 800, y: 100 } ];
const projectiles = []; const particleEffects = [];

const hudButtons = [
    { id: 'upgrade-scorpion', x: 220, y: 475, w: 100, h: 50, label: 'Scorpion LV.3', cost: 1500, heroIndex: 0 },
    { id: 'upgrade-subzero', x: 330, y: 475, w: 100, h: 50, label: 'Sub-Zero LV.3', cost: 1500, heroIndex: 1 },
    { id: 'upgrade-raiden', x: 440, y: 475, w: 100, h: 50, label: 'Raiden LV.3', cost: 1500, heroIndex: 2 },
    { id: 'add-tower', x: 560, y: 475, w: 110, h: 50, label: 'ÚJ TORONY (+)', cost: 1000, type: 'build-prompt' },
    { id: 'indit-hullam', x: 685, y: 475, w: 110, h: 50, label: 'HULLÁM INDÍTÁSA', cost: 0, type: 'wave-start' },
    { id: 'add-locked', x: 810, y: 475, w: 110, h: 50, label: 'ZÁROLT MOD', cost: null, locked: true }
];

function openUpgrade(index) {
    selectedHeroIndex = index; const hero = heroes[index];
    document.getElementById('modal-hero-emoji').innerText = hero.emoji; document.getElementById('modal-hero-pic').style.borderColor = hero.color; document.getElementById('modal-hero-name').innerText = hero.name.toUpperCase(); document.getElementById('modal-hero-level').innerHTML = `Szint: Lv.${hero.level} ➔ <span class="stat-up">Lv.${hero.level + 1}</span>`; document.getElementById('modal-stat-dmg').innerText = hero.dmg; document.getElementById('modal-stat-dmg-next').innerText = hero.dmgNext; document.getElementById('modal-stat-rng').innerText = hero.range; document.getElementById('modal-stat-rng-next').innerText = hero.rangeNext; document.getElementById('modal-hero-desc').innerText = hero.desc;
    btnConfirm.innerText = `Megerősít (${hero.upgradeCost} 🪙)`; upgradeModal.style.display = 'block';
}

btnConfirm.addEventListener('click', () => {
    if (selectedHeroIndex !== null) {
        const hero = heroes[selectedHeroIndex];
        if (gold >= hero.upgradeCost) {
            gold -= hero.upgradeCost; hero.level += 1; hero.dmg = hero.dmgNext; hero.dmgNext = Math.round(hero.dmg * 1.35); hero.range = hero.rangeNext; hero.rangeNext = Math.round(hero.range * 1.15); hero.upgradeCost = Math.round(hero.upgradeCost * 1.25);
            if (selectedHeroIndex < 3) { hudButtons[selectedHeroIndex].label = `${hero.name} LV.${hero.level}`; hudButtons[selectedHeroIndex].cost = hero.upgradeCost; }
            playSound('upgrade'); createExplosion(hero.x, hero.y, '#ffd700'); showTextEffect(hero.x, hero.y - 30, "SZINTLÉPÉS! ▲", "#00ff66"); upgradeModal.style.display = 'none'; selectedHeroIndex = null;
        } else {
            playSound('error'); showTextEffect(canvas.width / 2, canvas.height / 2 - 100, "NINCS ELÉG ARANY!", "#ff0000");
        }
    }
});

btnCancel.addEventListener('click', () => { upgradeModal.style.display = 'none'; selectedHeroIndex = null; });
canvas.addEventListener('mousemove', function(e) { const rect = canvas.getBoundingClientRect(); hoverTile.x = e.clientX - rect.left; hoverTile.y = e.clientY - rect.top; });

canvas.addEventListener('click', function(e) {
    if (gameOver || gameWon) return;
    const rect = canvas.getBoundingClientRect(); const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;

    if (isPlacingTower) {
        let tooCloseToPath = false; pathPoints.forEach(p => { if (Math.hypot(p.x - mouseX, p.y - mouseY) < 30) { tooCloseToPath = true; } });
        if (mouseY > 440) { isPlacingTower = false; return; }
        if (tooCloseToPath) { playSound('error'); showTextEffect(mouseX, mouseY, "ÚTRA NEM ÉPÍTHETSZ!", "#ff0000"); return; }

        if (gold >= 1000) {
            gold -= 1000; let typeIndex = Math.floor(Math.random() * 3);
            let template = [
                { name: 'Scorpion', emoji: '🔥', color: '#ff5500', dmg: 200, range: 90, sound: 'hit-fire', desc: 'Tüzes támadás' },
                { name: 'Sub-Zero', emoji: '❄️', color: '#00aeff', dmg: 140, range: 110, sound: 'hit-ice', desc: 'Lassító fagy' },
                { name: 'Raiden', emoji: '⚡', color: '#ffffff', dmg: 220, range: 120, sound: 'hit-lightning', desc: 'Sújtó villámok' }
            ][typeIndex];

            heroes.push({ name: template.name, emoji: template.emoji, x: mouseX, y: mouseY, level: 1, dmg: template.dmg, dmgNext: Math.round(template.dmg * 1.4), range: template.range, rangeNext: Math.round(template.range * 1.2), upgradeCost: 800, color: template.color, radius: 18, desc: template.desc });
            playSound('buy'); createExplosion(mouseX, mouseY, template.color); showTextEffect(mouseX, mouseY, `ÚJ HŐS LEHELYEZVE!`, "#00ffaa"); isPlacingTower = false;
        } else {
            playSound('error'); showTextEffect(mouseX, mouseY, "NINCS ELÉG ARANYAD!", "#ff0000"); isPlacingTower = false;
        }
        return;
    }

    if (upgradeModal.style.display !== 'block') {
        hudButtons.forEach(btn => {
            if (mouseX >= btn.x && mouseX <= btn.x + btn.w && mouseY >= btn.y && mouseY <= btn.y + btn.h) {
                if (btn.heroIndex !== undefined) { openUpgrade(btn.heroIndex); }
                else if (btn.type === 'build-prompt') {
                    if (gold >= 1000) { isPlacingTower = true; showTextEffect(canvas.width/2, canvas.height/2, "Kattints a fenti csatatérre a lehelyezéshez!", "#ffd700"); }
                    else { playSound('error'); showTextEffect(mouseX, mouseY, "HIÁNYZÓ ARANY (1000)!", "#ff0000"); }
                } else if (btn.type === 'wave-start') { startNextWave(); }
                else if (btn.locked) { playSound('error'); showTextEffect(mouseX, mouseY, "A JÁTÉKMÓD KÉSŐBB ÉRHETŐ EL!", "#ff0000"); }
            }
        });

        heroes.forEach((hero, index) => { if (Math.hypot(hero.x - mouseX, hero.y - mouseY) < hero.radius + 5) { openUpgrade(index); } });
    }
});

function startNextWave() {
    if (enemies.length > 0) { showTextEffect(canvas.width / 2, 80, "MÉG VANNAK ELLENSÉGEK A PÁLYÁN!", "#ff3333"); return; }
    if (wave >= maxWaves) { return; }
    wave++; spawnedThisWave = 0; waveEnemiesCount = 10 + (wave * 3); showTextEffect(canvas.width / 2, canvas.height / 2, `${wave}. HULLÁM INDUL! Seregek közelednek...`, "#ff5500");
}

class Enemy {
    constructor() {
        this.x = pathPoints[0].x; this.y = pathPoints[0].y; this.pathIndex = 0;
        this.isBoss = (spawnedThisWave === waveEnemiesCount - 1) && (wave % 3 === 0 || wave === maxWaves);
        this.speed = this.isBoss ? 0.4 : 0.7 + (wave * 0.08) + Math.random() * 0.3;
        this.maxHp = (this.isBoss ? 4000 : 500) + (wave * 250); this.hp = this.maxHp; this.radius = this.isBoss ? 20 : 11;
        this.goldReward = this.isBoss ? 500 : 80 + Math.floor(Math.random() * 40); this.slowTimer = 0;
    }

    update() {
        if (this.slowTimer > 0) { this.slowTimer--; }
        if (this.pathIndex >= pathPoints.length - 1) {
            lives--; if (lives <= 0) { lives = 0; gameOver = true; playSound('defeat'); } return false;
        }
        const target = pathPoints[this.pathIndex + 1]; const dx = target.x - this.x; const dy = target.y - this.y; const distance = Math.hypot(dx, dy);
        if (distance < 5) { this.pathIndex++; } else {
            let currentSpeed = this.speed; if (this.slowTimer > 0) { currentSpeed *= 0.45; }
            this.x += (dx / distance) * currentSpeed; this.y += (dy / distance) * currentSpeed;
        }
        return true;
    }

    draw() {
        if (this.slowTimer > 0) { ctx.fillStyle = '#00e1ff'; } else { ctx.fillStyle = this.isBoss ? '#7a001e' : '#bd2300'; }
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();

        if (this.isBoss) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = '#ffcc00'; ctx.font = "bold 9px serif"; ctx.fillText("FŐGONOSZ", this.x - 24, this.y - 25); }
        const barW = this.isBoss ? 40 : 20; const barH = 4; ctx.fillStyle = '#3a0000'; ctx.fillRect(this.x - barW/2, this.y - this.radius - 8, barW, barH); ctx.fillStyle = this.slowTimer > 0 ? '#00b7ff' : '#00ff66'; ctx.fillRect(this.x - barW/2, this.y - this.radius - 8, barW * (this.hp / this.maxHp), barH);
    }
}

function showTextEffect(x, y, text, color) { particleEffects.push({ x, y, text, color, alpha: 1 }); }
function createExplosion(x, y, color) {
    for (let i = 0; i < 20; i++) { particleEffects.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, radius: Math.random() * 4 + 1.5, color: color, alpha: 1, decay: 0.025 + Math.random() * 0.035 }); }
}

function update() {
    if (gameOver || gameWon) return;
    if (spawnedThisWave < waveEnemiesCount) { spawnTimer++; if (spawnTimer >= spawnRate) { enemies.push(new Enemy()); spawnedThisWave++; spawnTimer = 0; } }
    for (let i = enemies.length - 1; i >= 0; i--) { if (!enemies[i].update()) { enemies.splice(i, 1); } }
    if (wave >= maxWaves && spawnedThisWave >= waveEnemiesCount && enemies.length === 0 && !gameWon) { gameWon = true; playSound('victory'); }

    heroes.forEach(hero => {
        let target = null; let minDist = hero.range;
        enemies.forEach(enemy => { const dist = Math.hypot(enemy.x - hero.x, enemy.y - hero.y); if (dist < minDist) { minDist = dist; target = enemy; } });

        if (target) {
            let fireChance = 0.04; if (hero.name === 'Raiden') fireChance = 0.07; if (hero.name === 'Scorpion') fireChance = 0.025;
            if (Math.random() < fireChance) {
                target.hp -= hero.dmg;
                if (hero.name === 'Scorpion' || hero.emoji === '🔥') { playSound('hit-fire'); target.hp -= hero.dmg * 0.2; createExplosion(target.x, target.y, '#ff4400'); }
                else if (hero.name === 'Sub-Zero' || hero.emoji === '❄️') { playSound('hit-ice'); target.slowTimer = 90; createExplosion(target.x, target.y, '#00e5ff'); }
                else if (hero.name === 'Raiden' || hero.emoji === '⚡') { playSound('hit-lightning'); createExplosion(target.x, target.y, '#ffffff'); }

                projectiles.push({ x1: hero.x, y1: hero.y, x2: target.x, y2: target.y, color: hero.color, life: 12 });
                if (target.hp <= 0) {
                    const idx = enemies.indexOf(target);
                    if (idx > -1) { gold += target.goldReward; score += 50; createExplosion(target.x, target.y, '#ffd700'); showTextEffect(target.x, target.y, `+${target.goldReward} 🪙`, '#ffd700'); enemies.splice(idx, 1); }
                }
            }
        }
    });

    for (let i = particleEffects.length - 1; i >= 0; i--) {
        const p = particleEffects[i];
        if (p.text) { p.y -= 0.6; p.alpha -= 0.015; if (p.alpha <= 0) particleEffects.splice(i, 1); }
        else { p.x += p.vx; p.y += p.vy; p.alpha -= p.decay; if (p.alpha <= 0) particleEffects.splice(i, 1); }
    }
    for (let i = projectiles.length - 1; i >= 0; i--) { projectiles[i].life--; if (projectiles[i].life <= 0) projectiles.splice(i, 1); }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0a0503'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1e0500'; ctx.fillRect(0, 100, canvas.width, 30);
    ctx.fillStyle = '#ff1e00'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff1e00'; ctx.fillRect(0, 110, canvas.width, 8); ctx.shadowBlur = 0;

    ctx.strokeStyle = '#1b120d'; ctx.lineWidth = 42; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    pathPoints.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.stroke();
    ctx.strokeStyle = '#4a2512'; ctx.lineWidth = 36; ctx.stroke();
    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2; ctx.stroke();

    heroes.forEach(hero => {
        ctx.strokeStyle = isPlacingTower || selectedHeroIndex !== null ? 'rgba(212, 175, 55, 0.08)' : 'rgba(212, 175, 55, 0.05)';
        ctx.beginPath(); ctx.arc(hero.x, hero.y, hero.range, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#211209'; ctx.beginPath(); ctx.arc(hero.x, hero.y, hero.radius + 4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = hero.color; ctx.beginPath(); ctx.arc(hero.x, hero.y, hero.radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(hero.emoji, hero.x, hero.y + 7);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Georgia'; ctx.fillText(`${hero.name} L.${hero.level}`, hero.x, hero.y - 25);
    });

    enemies.forEach(enemy => enemy.draw());
    projectiles.forEach(proj => { ctx.strokeStyle = proj.color; ctx.lineWidth = 4; ctx.shadowBlur = 12; ctx.shadowColor = proj.color; ctx.beginPath(); ctx.moveTo(proj.x1, proj.y1); ctx.lineTo(proj.x2, proj.y2); ctx.stroke(); ctx.shadowBlur = 0; });

    particleEffects.forEach(p => {
        ctx.textAlign = 'center';
        if (p.text) { ctx.fillStyle = p.color; ctx.font = 'bold 13px Cinzel'; ctx.fillText(p.text, p.x, p.y); }
        else { ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1.0; }
    });

    if (isPlacingTower && hoverTile.y < 440) {
        ctx.strokeStyle = 'rgba(0, 255, 170, 0.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hoverTile.x, hoverTile.y, 90, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(0, 255, 170, 0.2)'; ctx.beginPath(); ctx.arc(hoverTile.x, hoverTile.y, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '12px Georgia'; ctx.fillText("Ide kattints!", hoverTile.x, hoverTile.y - 22);
    }

    ctx.fillStyle = '#0a0503'; ctx.fillRect(0, 0, canvas.width, 50);
    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 50); ctx.lineTo(canvas.width, 50); ctx.stroke();
    ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 18px Cinzel'; ctx.textAlign = 'left'; ctx.fillText(`MORTAL KOMBAT DEFENDS`, 20, 31);
    ctx.fillStyle = '#d4af37'; ctx.fillText(`WAVE ${wave}/10`, canvas.width / 2 - 40, 31);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ff3333'; ctx.fillText(`♥ ÉLEK: ${lives}/20`, canvas.width - 340, 31);
    ctx.fillStyle = '#ffd700'; ctx.fillText(`Arany: ${gold} 🪙`, canvas.width - 190, 31);
    ctx.fillStyle = '#00ffaa'; ctx.fillText(`💀 Koponyák: ${score}`, canvas.width - 20, 31);

    ctx.fillStyle = '#0c0704'; ctx.fillRect(0, 460, canvas.width, 80);
    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 460); ctx.lineTo(canvas.width, 460); ctx.stroke();
    ctx.strokeStyle = '#3d2215'; ctx.strokeRect(10, 470, 180, 60); ctx.fillStyle = '#1c0f0a'; ctx.fillRect(11, 471, 178, 58); ctx.fillStyle = '#444'; ctx.font = '9px Cinzel'; ctx.textAlign = 'center'; ctx.fillText("MINIMAP (Aktív csatatér)", 100, 505);

    hudButtons.forEach(btn => {
        ctx.fillStyle = btn.locked ? '#1a1412' : '#2b1208'; ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
        ctx.strokeStyle = btn.locked ? '#444' : '#d4af37'; ctx.lineWidth = 1; ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
        ctx.fillStyle = btn.locked ? '#666' : '#fff'; ctx.font = 'bold 9px Cinzel'; ctx.textAlign = 'center'; ctx.fillText(btn.label, btn.x + (btn.w / 2), btn.y + 22);
        if (btn.cost) { ctx.fillStyle = btn.locked ? '#444' : '#ffd700'; ctx.font = 'bold 10px Cinzel'; ctx.fillText(`${btn.cost} 🪙`, btn.x + (btn.w / 2), btn.y + 38); }
    });

    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#ff1e00'; ctx.font = 'bold 50px Cinzel'; ctx.textAlign = 'center'; ctx.fillText("VESZTETTÉL!", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff'; ctx.font = '20px Cinzel'; ctx.fillText("Shao Kahn seregei lerombolták a védelmet.", canvas.width / 2, canvas.height / 2 + 30);
    }
    if (gameWon) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#00ff55'; ctx.font = 'bold 55px Cinzel'; ctx.textAlign = 'center'; ctx.fillText("GYŐZELEM!", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff'; ctx.font = '20px Cinzel'; ctx.fillText("Sikeresen megvédted a birodalmat!", canvas.width / 2, canvas.height / 2 + 30);
    }
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
</html>
